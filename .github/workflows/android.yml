name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Restore release keystore
        if: ${{ false }} # Signed releases are built by the tag-only Release workflow.
        env:
          KEYSTORE_B64: ${{ secrets.TURBOGLOW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::TURBOGLOW_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/turboglow.keystore.jks

      - name: Build release APK
        if: ${{ false }}
        env:
          STORE_PASS: ${{ secrets.TURBOGLOW_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.TURBOGLOW_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TURBOGLOW_KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets (TURBOGLOW_STORE_PASSWORD / TURBOGLOW_KEY_PASSWORD / TURBOGLOW_KEY_ALIAS) are missing."
            exit 1
          fi
          ./gradlew :app:assembleRelease --stacktrace "-Pturboglow.storePassword=$STORE_PASS" "-Pturboglow.keyPassword=$KEY_PASS" "-Pturboglow.keyAlias=$KEY_ALIAS"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboGlow-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: TurboGlow-release
          path: app/build/outputs/apk/release/*.apk
